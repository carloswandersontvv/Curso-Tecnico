<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro - VivaComércio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="form-card">
    <h2>Cadastro</h2>
    <input id="nome" placeholder="Nome completo" />
    <input id="emailCadastro" placeholder="E-mail" type="email" />
    <input id="senhaCadastro" placeholder="Senha" type="password" />
    <input id="cidadeCadastro" placeholder="Cidade" />
    <button id="btnCadastro">Criar conta</button>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
